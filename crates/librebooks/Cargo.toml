[package]
name = "librebooks"
description = "LibreBooks: open-source double-entry accounting, a drop-in replacement for QuickBooks Desktop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
lb-core.workspace = true
lb-store.workspace = true
lb-server.workspace = true
lb-auth.workspace = true
lb-qbd.workspace = true
jiff.workspace = true
lb-backup.workspace = true
lb-update.workspace = true
lb-tunnel.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true
serde_json.workspace = true
axum.workspace = true
# To read a saved bridge key out of the secret store (SecretString).
age.workspace = true
# `service run` has no console: tracing goes to a rolling file in the data dir.
tracing-appender.workspace = true

[target.'cfg(windows)'.dependencies]
# `librebooks service`: the Service Control Manager entry point and registration.
windows-service.workspace = true

[features]
default = ["qbsdk"]
# The QuickBooks SDK transport for `import qbd --transport sdk` (Windows only).
qbsdk = ["lb-qbd/qbsdk", "lb-server/qbsdk"]

[lints]
workspace = true
