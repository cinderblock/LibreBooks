[package]
name = "lb-tunnel"
description = "LibreBooks cloudflared wrapper: download, verify and supervise a Cloudflare tunnel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
reqwest.workspace = true
tokio.workspace = true
base64.workspace = true
tempfile.workspace = true
flate2 = "1.1.10"
tar = "0.4.46"
# Verify only (Cloudflare Access JWTs). Signing and decryption, where rsa 0.9's
# timing advisory (RUSTSEC-2023-0071) applies, are used in tests alone.
rsa = { version = "0.9.10", features = ["sha2"] }
process-wrap = { version = "10.0.1", features = ["tokio1"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
axum.workspace = true

# A stand-in for cloudflared that the supervision tests run as a child process.
# Test-only; tiny, std-only.
[[bin]]
name = "lb-tunnel-fake-cloudflared"
path = "tests/support/fake_cloudflared.rs"
test = false
doc = false

[lints]
workspace = true
