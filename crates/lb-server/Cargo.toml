[package]
name = "lb-server"
description = "LibreBooks HTTP server: JSON API, live updates, embedded web UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
lb-core.workspace = true
lb-store.workspace = true
lb-reports.workspace = true
lb-auth.workspace = true
lb-qbd.workspace = true
lb-feeds.workspace = true
lb-backup.workspace = true
lb-update.workspace = true
lb-tunnel.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
uuid.workspace = true
tokio.workspace = true
rusqlite.workspace = true
tokio-stream.workspace = true
futures.workspace = true
axum.workspace = true
axum-extra.workspace = true
tower.workspace = true
tower-http.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
url.workspace = true
subtle.workspace = true
rand.workspace = true
rust_decimal.workspace = true
base64.workspace = true
hex.workspace = true
# The secret store (age, as lb-backup uses), the feed providers' HTTP client type,
# and atomic file writes.
age.workspace = true
reqwest.workspace = true
tempfile.workspace = true

[features]
default = ["qbsdk"]
# The QuickBooks SDK transport (Windows only; lb-qbd leaves it out elsewhere).
qbsdk = ["lb-qbd/qbsdk"]

[dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true
http-body-util = "0.1"
ed25519-dalek.workspace = true
base64.workspace = true
# Signing Cloudflare Access test tokens with lb-tunnel's test keys.
rsa = { version = "0.9.10", features = ["sha2"] }

[lints]
workspace = true

