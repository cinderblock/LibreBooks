[package]
name = "lb-auth"
description = "LibreBooks auth: passkeys, enrolment tokens, device keys, sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
lb-core.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
jiff.workspace = true
uuid.workspace = true
rand.workspace = true
base64.workspace = true
sha2.workspace = true
subtle.workspace = true
ed25519-dalek.workspace = true
# serde_relaxed: accept the response JSON browsers and @simplewebauthn/browser
# actually send (unknown fields ignored, optional Level 3 fields optional).
webauthn_rp = { workspace = true, features = ["serde_relaxed"] }
url.workspace = true
ts-rs.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The software authenticator in the tests signs ES256 like a platform passkey.
# 0.13 is the version webauthn_rp already builds, so this adds nothing new.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }

[lints]
workspace = true
