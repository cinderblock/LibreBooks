[package]
name = "lb-qbd"
description = "LibreBooks QuickBooks Desktop import: read-only bridge client, qbXML normaliser, Web Connector."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
lb-core.workspace = true
lb-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
jiff.workspace = true
uuid.workspace = true
rust_decimal.workspace = true
reqwest.workspace = true
tokio.workspace = true
url.workspace = true
quick-xml.workspace = true
ts-rs.workspace = true

# The QuickBooks SDK over COM (QBXMLRP2), for LibreBooks on the QuickBooks
# machine. Windows only; `--no-default-features` leaves it out.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[features]
default = ["qbsdk"]
qbsdk = ["dep:windows"]

[dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true
axum.workspace = true

[lints]
workspace = true
